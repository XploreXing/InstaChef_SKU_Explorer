# Evaluator cases: dishes for the LLM evaluator, used by evals/run_evaluator.py.
#
# Unlike the guard and duplicate cases these cost API calls and do not give
# the same answer twice, so they are not part of the normal test run.
#
#   label           reject | accept, decided by a person. Empty means nobody
#                   has judged the dish yet: it still counts for stability,
#                   but not for agreement.
#   reason          for a rejected dish, why the person rejected it
#   source          human   = a rejection recorded in the app (data/feedback)
#                   history = a dish the pipeline proposed earlier, taken from
#                             data/logs (two per cuisine)
#   previous_score  what the evaluator gave the dish back then, under the old
#                   scoring that added a per-cuisine blue-ocean term. Context
#                   only, never an expected value, and not comparable with
#                   today's dish scores.
#
# To add a label, a domain expert fills in `label` (and `reason` for a
# rejection). Accepted dishes are missing so far. Until some are labelled the
# ranking cannot be checked against people: the script can only report how
# often a rejected dish would still have been kept.

