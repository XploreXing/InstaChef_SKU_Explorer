output:
  base_dir: "/Users/xingrancao/Documents/Obsidian Vault/InstaChef_Intern"
  filename_prefix: "sku_recommendations"
  format: "json"

llm:
  base_url: "https://api.siliconflow.cn/v1"
  api_key_env: "LLM_API_KEY"
  enrichment_model: "Pro/zai-org/GLM-5.1"
  generator_model: "Pro/zai-org/GLM-5.1"
  evaluator_model: "Pro/zai-org/GLM-5.1"
  enrichment_temperature: 0.1
  generator_temperature: 0.7
  evaluator_temperature: 0.1

search:
  provider: "tavily"
  api_key_env: "TAVILY_API_KEY"
  max_results_per_query: 5
  region: "sg"
  time_range: "month"
  target_domains:
    - "foodpanda.sg"
    - "grabfood.sg"
    - "stuffd.sg"
    - "guzmanygomez.com.sg"
    - "jinjjachicken.com"
    - "nakhonkitchen.com"
    - "enciktan.com.sg"
    - "dintaifung.com.sg"
    - "crystaljade.com"
    - "misstamchiak.com"
    - "sethlui.com"
    - "eatbook.sg"
  query_templates:
    - "\"{cuisine_en}\" rice bowl menu dish Singapore"
    - "{cuisine_en} signature dishes menu items names Singapore 2026"
    - "site:foodpanda.sg {cuisine_en} bowl halal"
    - "\"best {cuisine_en}\" bowl Singapore restaurant dish"
  cuisine_overrides:
    Mexican:
      extra_queries:
        - "site:stuffd.sg menu burrito bowl"
        - "site:guzmanygomez.com.sg menu chicken beef"
        - "Mexican halal rice bowl chain Singapore"
        - "barbacoa tinga fajita chipotle mole Mexican dish Singapore"
    Chinese:
      extra_queries:
        - "site:dintaifung.com.sg menu fried rice noodle"
        - "site:crystaljade.com menu braised stir-fried"
        - "Din Tai Fung Singapore new dish 2026"
        - "mapo kungpao claypot dimsum braised Chinese dish Singapore"
    Japanese:
      extra_queries:
        - "site:foodpanda.sg Japanese curry rice donburi"
        - "site:grabfood.sg Japanese teriyaki gyudon"
        - "omurice Singapore Japanese dish 2026"
        - "teriyaki gyudon oyakodon soba donburi Japanese dish Singapore"
    Korean:
      extra_queries:
        - "site:jinjjachicken.com menu chicken dish"
        - "site:foodpanda.sg Korean bibimbap bulgogi"
        - "Korean jjigae stew Singapore dish 2026"
        - "bulgogi dakgalbi tteokbokki bibimbap jjigae Korean dish Singapore"
    Thai:
      extra_queries:
        - "site:nakhonkitchen.com menu curry stir-fry"
        - "site:foodpanda.sg Thai green red curry basil"
        - "massaman curry Singapore Thai dish 2026"
        - "tomyum padkrapao greencurry massaman basil Thai dish Singapore"
    Singaporean/Malay:
      extra_queries:
        - "site:enciktan.com.sg menu nasi rendang"
        - "site:foodpanda.sg nasi lemak sambal dish"
        - "nasi kerabu Singapore Malay dish rare"
        - "rendang sambal nasilemak ayam ikan meegoreng Malay dish Singapore"

data:
  sku_source: "local_csv"
  sku_json_path: "data/input/current_skus.json"          # deprecated, kept for reference
  sku_csv_path: "data/input/current_commodities.csv"
  enriched_cache_path: "data/cache/enriched_commodities.json"

orchestrator:
  max_rounds_per_cuisine: 3
  target_per_cuisine: 10
  pass_threshold: 80
  cuisines: ["Chinese", "Japanese", "Korean", "Thai", "Singaporean/Malay", "Mexican"]
